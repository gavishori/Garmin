<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>מפת האימונים · Garmin</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header>
    <a class="gavish-hub" href="https://gavishori.github.io/" title="גביש">💎</a>
    <h1>🗺️ מפת האימונים</h1>
    <span id="stats" class="stats"></span>
    <span class="grow"></span>
    <button id="btnTrails" class="ghost" hidden>🥾 שבילים</button>
    <button id="btnList" class="ghost" hidden>☰ רשימה</button>
    <button id="btnImport" class="ghost" hidden>⬆ ייבוא</button>
    <button id="btnOut" class="ghost" hidden>יציאה</button>
    <input id="file" type="file" accept=".json,.gpx" multiple hidden>
  </header>

  <section id="login" class="center" hidden>
    <p>כניסה עם חשבון Google המורשה</p>
    <button id="btnLogin" class="primary">התחברות עם Google</button>
    <p id="loginErr" class="err"></p>
  </section>

  <main id="app" hidden>
    <div id="filters">
      <select id="year"><option value="">כל השנים</option></select>
      <details id="typesBox"><summary id="typesSum">כל סוגי האימון</summary><div id="types"></div></details>
      <label class="ctl" title="שקיפות ועובי קווי המסלולים">עוצמת מסלולים <input id="strength" type="range" min="10" max="100" step="5"></label>
      <label class="ctl" title="כמה מפת הרקע בולטת">בהירות מפה <input id="bright" type="range" min="15" max="100" step="5"></label>
      <label class="ctl" title="חיתוך קווים ישרים ארוכים שנוצרו משיבושי GPS או מהשהיית השעון"><input id="clean" type="checkbox"> ניקוי קפיצות GPS</label>
    </div>
    <div id="wrap">
      <div id="map"></div>
      <aside id="list" hidden></aside>
      <aside id="trails" hidden></aside>
    </div>
    <div id="msg" hidden></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="app.js?v=8"></script>
</body>
</html>
